name: System theme

on:
  # Only on main: a branch pushed to this repo would otherwise also run every
  # job a second time through its pull request.
  push:
    branches: [main]
    paths:
      - crates/theme/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/theme.yml
  pull_request:
    paths:
      - crates/theme/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/theme.yml

jobs:
  # The Android backend is checked by android.yml, along with every other crate.
  native:
    name: Theme (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p robius-theme --all-targets -- -D warnings
      - run: cargo test -p robius-theme
      # This flips the runner's own app theme and back, so it only runs when asked for.
      - name: Follow a real theme change
        if: runner.os == 'Windows'
        run: cargo test -p robius-theme --test windows -- --ignored
      - name: Compile the iOS backend
        if: matrix.os == 'macos-15'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo clippy -p robius-theme --target aarch64-apple-ios -- -D warnings
          cargo clippy -p robius-theme --target aarch64-apple-ios-sim -- -D warnings
      - name: Compile for a platform without a system theme
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p robius-theme --target wasm32-unknown-unknown -- -D warnings
